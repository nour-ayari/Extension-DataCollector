<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <title>Data Collector</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      width: 240px;
      padding: 16px;
      background: white;
    }
    h3 { font-size: 15px; margin-bottom: 12px; color: #1a1a1a; }
    .status {
      padding: 10px;
      border-radius: 6px;
      text-align: center;
      font-size: 13px;
      font-weight: bold;
    }
    .on  { background: #e8f5e9; color: #2e7d32; }
    .off { background: #ffebee; color: #c62828; }
    .unknown { background: #f5f5f5; color: #777; }
    button {
      width: 100%;
      margin-top: 10px;
      padding: 9px;
      font-size: 13px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background: #1565c0;
      color: white;
      font-weight: bold;
    }
    button:hover { background: #0d47a1; }
    .info {
      font-size: 11px;
      color: #999;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h3>📊 Data Collector</h3>
  <div class="status unknown" id="status">Chargement...</div>
  <button id="toggle">Changer mon choix</button>
  <p class="info" id="date"></p>

  <script src="popup.js"></script>
</body>
</html>
